<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
    
<div class="container">
    <div class="sidebar">
        <div class="logobox">
            <img src="images/logo.png" alt="Odin Project's logo">
            <span>Odin</span>
        </div>
        <p>Photo by <a href="https://unsplash.com/@asherhop?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Asher Hopkins</a> on <a href="https://unsplash.com/photos/overhead-view-of-a-narrow-road-through-a-dense-forest-uk2tUuTwHgw?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
    </div>
    <div class="form-section">
         <h2>Let's do this!</h2>
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>

        <p>Sign up <em>now</em> to get started.</p>

        <p>You <em>know</em> you want to.</p>

        <form action="#" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" name="name" id="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" name="name" id="last_name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone_number">
                    PHONE NUMBER
                    <small>(Format : 123-456-7890)</small>
                    </label>
                    <input type="tel" name="phone_number" id="phone_number" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" name="password" id="password" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm_password">CONFIRM PASSWORD</label>
                    <input type="password" name="confirm_pass" id="confirm_password" required>
                </div>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <em class="log-in-em">Log in</em></p>

    </div>
</div>

</body>
</html>
